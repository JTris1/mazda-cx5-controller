; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
; Pinned to the official PlatformIO platform (Arduino core 2.0.17). A plain "espressif32" can resolve
; to a different platform when another one with that name is installed.
platform = platformio/espressif32@7.1.3
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
; build_flags =
;     -DARDUINO_USB_CDC_ON_BOOT=1
; Debug logging from the Arduino core and libraries (shows the WireGuard library's own messages).
; Remove when the tunnel works: it is noisy.
; build_flags = -DCORE_DEBUG_LEVEL=3
lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    ciniml/WireGuard-ESP32@^0.1.5
    bblanchon/ArduinoJson@^7.4.3
; monitor_echo = yes   ; off: the firmware echoes keystrokes itself

; LilyGO T-SIM7670G-S3: the USB-C port goes straight to the ESP32-S3's built-in USB
; (it shows up as "USB JTAG/serial debug unit"), with no USB-to-serial chip. Without
; ARDUINO_USB_CDC_ON_BOOT, Serial writes to the UART pins and nothing appears over USB.
; Reuses the Freenove board settings above (8 MB flash, octal PSRAM; the LilyGO module has more
; flash but we use little). Not yet checked against this board's actual PSRAM type: we do not
; use PSRAM. Only the USB console differs.
[env:lilygo_t_sim7670g_s3]
extends = env:freenove_esp32_s3_wroom
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
