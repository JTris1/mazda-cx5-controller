; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; LilyGO T-SIM7670G-S3 (ESP32-S3 + SIM7670G cellular modem).
;
; Arduino core 3.x (pioarduino) because its PPP library gives the ESP32 a real IP connection over
; the modem, which the WireGuard tunnel and the HTTPS API need. The platform is pinned to an exact
; release: a plain "espressif32" can resolve to a different platform than you expect.
[env:lilygo_t_sim7670g_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Quad-SPI flash. This board's PSRAM is not octal (the boot log said "PSRAM chip is not connected, or
; wrong PSRAM line mode"), and we do not use PSRAM, so none is requested.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; The USB-C port goes straight to the ESP32-S3's built-in USB (no USB-to-serial chip), so Serial
; must be the built-in USB console. USB_MODE=1 (from the board definition) selects it.
extra_scripts = pre:tools/embed_web.py

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
; Uncomment for debug logging from the Arduino core and libraries. Noisy.
;    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    bblanchon/ArduinoJson@^7.4.3
